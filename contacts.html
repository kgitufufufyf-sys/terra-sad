<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Заявка — sihay</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="header">
  <div class="wrap header-inner">
    <a class="logo" href="index.html">sihay</a>
    <nav class="nav" id="nav">
      <a href="works.html">Работы</a>
      <a href="services.html">Услуги</a>
      <a href="process.html">Процесс</a>
      <a href="faq.html">Вопросы</a>
      <a class="btn btn-dark" href="contacts.html" aria-current="page">Обсудить участок</a>
    </nav>
    <button class="burger" id="burger" aria-label="Открыть меню"><span></span><span></span></button>
  </div>
</header>
<main class="page">
  <div class="wrap split">
    <div>
      <p class="eyebrow">Заявка</p>
      <h1>Имя и телефон</h1>
      <p class="lead">Больше ничего не спрашиваем. Телефон студии на сайте появится, когда вы его дадите.</p>
    </div>
    <form class="form" id="leadForm">
      <label>Имя<input name="name" required autocomplete="name" /></label>
      <label>Телефон<input name="phone" required inputmode="tel" autocomplete="tel" /></label>
      <label class="check"><input name="adult" type="checkbox" required /> Мне есть 18 лет.</label>
      <label class="check"><input name="consent" type="checkbox" required /> Согласен на обработку имени и телефона, чтобы мне ответили. <a href="privacy.html">Политика</a></label>
      <button class="btn btn-dark" type="submit">Сохранить заявку</button>
      <p class="note" id="formOk" hidden></p>
    </form>
  </div>
</main>
<footer class="footer"><div class="wrap footer-inner"><a href="index.html">sihay</a><a href="privacy.html">Конфиденциальность</a></div></footer>
<div class="cookie" id="cookie" hidden><p>Сайт запоминает только ваш выбор по cookie. <a href="cookies.html">Политика cookie</a></p><button class="btn btn-dark" id="cookieOk" type="button">Понятно</button></div>
<script src="script.js"></script>
</body>
</html>
